server:
  port: 8082

spring:
  application:
    name: payout-service
  datasource:
    url: jdbc:postgresql://localhost:5433/payouts
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payout-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: a malformed message is logged instead of blocking the partition forever
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.chenyumeng.marketplace.events.OrderPlacedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.chenyumeng.marketplace.events
    producer: # only used by the integration test to publish events
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  topics:
    order-placed: orders.placed
  commission-rate: 0.10   # the marketplace keeps 10 %
